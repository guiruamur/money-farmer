[project]
name = "crypto-farmer"
version = "0.1.0"
description = "Servicio local de señales cripto con IA local"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.2",
    "pandas>=2.2",
    "pandas-ta>=0.3.14b",
    "httpx>=0.27",
    "python-telegram-bot>=21",
    "apscheduler>=3.10",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "chromadb>=0.5",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crypto_farmer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "llm: tests that require a running Ollama (set RUN_LLM_TESTS=1 to enable)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
