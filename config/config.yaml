scheduler:
  interval_minutes: 1   # Modo demo: 1 ciclo/min. Subir a 15 para 24/7 real.
  timezone: "Europe/Madrid"

market:
  exchange: binance
  pairs:
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
    - BNB/USDT
    - XRP/USDT
    # Reserva (descomentar para top 10):
    # - ADA/USDT
    # - DOGE/USDT
    # - AVAX/USDT
    # - LINK/USDT
    # - DOT/USDT
  timeframe: "15m"
  ohlcv_lookback: 200

news:
  enabled: false  # CryptoPanic API endpoint en investigación; ciclo funciona sin noticias
  sources:
    - cryptopanic
  max_age_hours: 4

prefilter:
  rsi_oversold: 30
  rsi_overbought: 70
  volume_anomaly_factor: 1.8
  atr_expansion_factor: 1.5
  cooldown_minutes: 3   # Modo demo. Subir a 60 en producción.

llm:
  provider: ollama
  base_url: "http://localhost:11434"
  model: "qwen2.5:7b-instruct-q4_K_M"
  embedding_model: "mxbai-embed-large"
  timeout_seconds: 30
  max_retries: 1

learning:
  memory_k: 5
  feedback_lookback: 20
  outcome_horizons_hours: [1, 4, 24]

delivery:
  telegram:
    enabled: true
    min_confidence: 60
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
    digest_minutes: 30          # 0 desactiva el resumen automático
    digest_lookback_hours: 0.5  # ventana cubierta en cada digest

news_credentials:
  cryptopanic_token: "${CRYPTOPANIC_API_TOKEN}"

logging:
  level: INFO
  format: json
  file: "data/logs/crypto_farmer.log"
  rotation: "1 day"
  retention_days: 30

storage:
  sqlite_path: "data/crypto_farmer.db"
  chroma_path: "data/memory"
