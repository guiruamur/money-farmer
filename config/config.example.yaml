scheduler:
  interval_minutes: 15
  timezone: "Europe/Madrid"

market:
  exchange: binance
  pairs:
    - BTC/USDT
    - ETH/USDT
    - BNB/USDT
    - SOL/USDT
    - XRP/USDT
    - ADA/USDT
    - DOGE/USDT
    - AVAX/USDT
    - LINK/USDT
    - DOT/USDT
  timeframe: "15m"
  ohlcv_lookback: 200

news:
  enabled: true
  sources:
    - cryptopanic
  max_age_hours: 4

prefilter:
  rsi_oversold: 30
  rsi_overbought: 70
  volume_anomaly_factor: 1.8
  atr_expansion_factor: 1.5
  cooldown_minutes: 60

llm:
  provider: ollama
  base_url: "http://localhost:11434"
  model: "qwen2.5:7b-instruct-q4_K_M"
  embedding_model: "nomic-embed-text"
  timeout_seconds: 30
  max_retries: 1

learning:
  memory_k: 5
  feedback_lookback: 20
  outcome_horizons_hours: [1, 4, 24]

delivery:
  telegram:
    enabled: true
    min_confidence: 60
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"

news_credentials:
  cryptopanic_token: "${CRYPTOPANIC_API_TOKEN}"

logging:
  level: INFO
  format: json
  file: "data/logs/crypto_farmer.log"
  rotation: "1 day"
  retention_days: 30

storage:
  sqlite_path: "data/crypto_farmer.db"
  chroma_path: "data/memory"

# Modo on-chain (web3 W1): leer precio de un pool Uniswap v3 por RPC.
# Lo usa el comando `python -m crypto_farmer onchain`. No afecta al bot CEX.
# La URL del RPC va en .env (ONCHAIN_RPC_URL), nunca aquí.
onchain:
  chain: base
  pool_address: "0x<pool_uniswap_v3_WETH_USDC_en_base>"  # de info.uniswap.org
  token0_decimals: 18   # WETH
  token1_decimals: 6    # USDC
  pair_label: "ETH/USDC"
  block_time_seconds: 2
